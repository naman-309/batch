<!DOCTYPE html>
<html>

<head>
    <title>Simple Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            /* display: flex; */
            /* justify-content: center; */
            align-items: center;
            /* height: 100vh; */
        }

        .card {
            background: white;
            padding: 25px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333;
        }

        p {
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>first Simple Card</h2>
        <p>This is a simple card created using HTML and CSS. It has one heading and a paragraph.</p>
    </div>

</body>

</html>
